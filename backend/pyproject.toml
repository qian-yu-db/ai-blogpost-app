[project]
name = "blog-assistant-backend"
version = "0.1.0"
description = "Backend for AI Blog Post App"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "anthropic>=0.40.0",
    "claude-code-sdk>=0.0.25",
    "websockets>=12.0",
    "python-multipart",
    "pydantic>=2.0",
    "markdown",
    "weasyprint",
    "python-dotenv",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "httpx", "respx"]
